<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<title>FocusFeed</title>
<script>
  // Se ejecuta antes del CSS para evitar el parpadeo de tema al cargar.
  (function(){
    try{
      var t=localStorage.getItem('ff_theme');
      if(t==='dark'||t==='light') document.documentElement.setAttribute('data-theme',t);
    }catch(e){}
  })();
</script>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
  /* Dirección: radio independiente (NTS, Freaks Only FM). Tinta sobre papel,
     cero radios, filetes de 2px, sombras duras desplazadas, condensada en
     mayúsculas para titulares y mono para metadatos. Un solo acento: rojo señal. */
  :root{
    --bg:#f3f1ec; --surface:#ffffff; --surface-2:#ebe8e1;
    --text:#0a0a0a; --text-2:#3a3a3a; --text-3:#6f6c66;
    --border:#0a0a0a; --border-2:#d6d2c8;
    --accent:#dc2828; --accent-ink:#ffffff; --accent-soft:#fbe4e2;
    --blue:#0a0a0a; --blue-soft:#ebe8e1;
    --danger:#b42318;
    --hard:4px 4px 0 0 var(--border);
    --shadow:none;
    --display:"Archivo Narrow","Univers Condensed","Helvetica Neue Condensed","Arial Narrow",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  /* Tres estados: automático (sigue al sistema), claro forzado y oscuro forzado.
     La paleta oscura se repite en los dos bloques para que la elección manual
     gane en ambas direcciones, no solo cuando coincide con el sistema. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0a0a0a; --surface:#111111; --surface-2:#1c1c1c;
      --text:#fafafa; --text-2:#c9c9c9; --text-3:#8a8a8a;
      --border:#fafafa; --border-2:#2a2a2a;
      --accent:#ff3b30; --accent-ink:#0a0a0a; --accent-soft:#2a1110;
      --blue:#fafafa; --blue-soft:#1c1c1c;
      --danger:#ff6b5e;
    }
  }
  :root[data-theme="dark"]{
      --bg:#0a0a0a; --surface:#111111; --surface-2:#1c1c1c;
      --text:#fafafa; --text-2:#c9c9c9; --text-3:#8a8a8a;
      --border:#fafafa; --border-2:#2a2a2a;
      --accent:#ff3b30; --accent-ink:#0a0a0a; --accent-soft:#2a1110;
      --blue:#fafafa; --blue-soft:#1c1c1c;
      --danger:#ff6b5e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
  }
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
  .wrap{max-width:1240px;margin:0 auto;padding:0 16px}
  .hidden{display:none !important}
  .mono{font-family:var(--mono)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- Top bar ---------- */
  .topbar{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:2px solid var(--border);padding-top:env(safe-area-inset-top)}
  .topbar-in{display:flex;align-items:center;justify-content:space-between;height:58px;gap:10px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;overflow:hidden}
  #view-title{overflow:hidden;text-overflow:ellipsis}
  .pill-count{flex:none}
  @media(max-width:400px){.topbar-title{font-size:22px;gap:6px}.brand{gap:8px}.pill-count{font-size:10.5px;padding:1px 4px}.topbar-actions .ico{width:36px}}
  .logo{flex:none;width:34px;height:34px;background:var(--text);color:var(--bg);font-family:var(--display);font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;letter-spacing:-.04em;box-shadow:3px 3px 0 0 var(--accent)}
  .topbar-title{font-family:var(--display);font-size:27px;font-weight:700;text-transform:uppercase;letter-spacing:-.01em;line-height:1;display:flex;align-items:center;gap:9px;min-width:0;white-space:nowrap}
  .pill-count{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--text);border:2px solid var(--border);padding:1px 6px;line-height:1.4}
  .ico{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--text);border:2px solid transparent}
  .ico:hover{border-color:var(--border)}
  .ico:active{background:var(--surface-2)}
  .ico svg{width:21px;height:21px}
  .topbar-actions{display:flex;align-items:center;gap:2px;flex:none}

  /* ---------- Ticker: los titulares del lote, como el "now playing" ---------- */
  .ticker{display:flex;align-items:stretch;height:32px;border-bottom:2px solid var(--border);background:var(--text);color:var(--bg);overflow:hidden;font-family:var(--mono);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
  .ticker .live{flex:none;display:flex;align-items:center;gap:7px;padding:0 12px;background:var(--accent);color:var(--accent-ink)}
  .ticker .live i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s ease-in-out infinite}
  .ticker .track{flex:1;overflow:hidden;display:flex;align-items:center;mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
  .ticker .run{display:flex;white-space:nowrap;animation:tick var(--dur,80s) linear infinite}
  .ticker .run span{padding:0 18px}
  .ticker .run b{color:var(--accent);padding-right:18px}
  .ticker:hover .run{animation-play-state:paused}
  .ticker .run .hl{cursor:pointer}
  .ticker .run .hl:hover,.ticker .run .hl:focus-visible{text-decoration:underline;text-underline-offset:3px;outline:none}
  .card{scroll-margin-top:calc(var(--hdr,60px) + 70px)}
  .card.flash{animation:flash 1.4s ease-out}
  @keyframes flash{0%,60%{outline:4px solid var(--accent);outline-offset:4px}100%{outline:4px solid transparent;outline-offset:4px}}
  @keyframes tick{to{transform:translateX(-50%)}}
  @keyframes pulse{50%{opacity:.25}}

  /* ---------- Tabs ---------- */
  .tabs{position:sticky;top:var(--hdr,calc(60px + env(safe-area-inset-top)));z-index:35;background:var(--bg);border-bottom:2px solid var(--border)}
  .tabs-in{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
  .tabs-in::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;font-family:var(--mono);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text);background:var(--surface);border:2px solid var(--border);padding:6px 10px;flex:none;transition:transform .12s ease,box-shadow .12s ease}
  .tab span{opacity:.6}
  .tab:hover{transform:translate(-2px,-2px);box-shadow:var(--hard)}
  .tab.on{background:var(--text);color:var(--bg)}
  .seltype{margin-left:auto;font-family:var(--mono);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text);background:var(--bg);border:2px dashed var(--border);border-radius:0;padding:6px 8px;outline:none;flex:none;-webkit-appearance:none;appearance:none;text-align:center}

  /* ---------- Feed ---------- */
  main{padding-top:18px}
  .newpill{position:fixed;left:50%;top:calc(var(--hdr,60px) + 62px);z-index:45;transform:translateX(-50%);font-family:var(--mono);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--accent);color:var(--accent-ink);border:2px solid var(--border);box-shadow:var(--hard);padding:8px 14px;white-space:nowrap;animation:pillin .25s cubic-bezier(.2,.8,.3,1)}
  @keyframes pillin{from{opacity:0;transform:translate(-50%,-8px)}}
  .newpill:active{transform:translate(calc(-50% + 2px),2px);box-shadow:none}
  .banner{background:var(--accent);color:var(--accent-ink);border:2px solid var(--border);padding:10px 14px;font-family:var(--mono);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
  #feed{display:grid;grid-template-columns:1fr;gap:20px;align-items:start}
  @media(min-width:760px){#feed{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}}
  @media(min-width:1100px){#feed{grid-template-columns:repeat(3,minmax(0,1fr))}}
  #feed>.batchend,#feed>.empty,#feed>.skel-row{grid-column:1/-1}

  .card{
    position:relative;background:var(--surface);border:2px solid var(--border);box-shadow:var(--hard);
    overflow:hidden;transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease,max-height .18s ease;
  }
  /* La entrada escalonada corre solo cuando el usuario pide el lote (pestaña,
     filtro, "nuevos"). Los refrescos de fondo no repintan: sin flashazo. */
  #feed.anim .card{animation:rise .42s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i,0) * 45ms)}
  @media(hover:hover){.card:hover{transform:translate(-3px,-3px);box-shadow:7px 7px 0 0 var(--border)}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}}
  .card.gone{opacity:0;transform:scale(.97);max-height:0;border-width:0;box-shadow:none}

  .media{display:block;position:relative;aspect-ratio:16/10;background:var(--surface-2);border-bottom:2px solid var(--border);overflow:hidden}
  .media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.2,.8,.3,1),filter .3s ease}
  @media(hover:hover){.card:hover .media img{transform:scale(1.04)}}
  .media .ph{position:absolute;inset:0;display:flex;align-items:flex-end;padding:14px;background:hsl(var(--h) 70% 46%);color:#fff;overflow:hidden}
  .media .ph b{font-family:var(--display);font-size:clamp(42px,13vw,64px);line-height:.86;font-weight:700;text-transform:uppercase;letter-spacing:-.02em;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .media .ph::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.09) 0 2px,transparent 2px 6px);pointer-events:none}
  .badge{position:absolute;left:0;bottom:0;display:flex;align-items:center;gap:6px;background:var(--text);color:var(--bg);font-family:var(--mono);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:5px 9px;border-top:2px solid var(--border);border-right:2px solid var(--border)}
  .badge.play{background:var(--accent);color:var(--accent-ink)}
  .score{position:absolute;right:10px;top:10px;font-family:var(--mono);font-size:12px;font-weight:700;background:var(--surface);color:var(--text);border:2px solid var(--border);padding:2px 7px;box-shadow:3px 3px 0 0 var(--border)}
  .score.hi{background:var(--accent);color:var(--accent-ink)}

  .card-body{padding:14px 15px 12px}
  .meta{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin-bottom:8px;min-width:0}
  .meta .src{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:0 1 auto;max-width:62%}
  .meta .by{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto;font-weight:400}
  .meta .when{flex:none;margin-left:auto}
  h2.title{margin:0;font-family:var(--display);font-size:25px;line-height:1.04;font-weight:700;letter-spacing:-.005em;text-transform:uppercase;overflow-wrap:anywhere}
  h2.title a{background-image:linear-gradient(var(--accent),var(--accent));background-size:0 3px;background-repeat:no-repeat;background-position:0 100%;transition:background-size .3s ease}
  @media(hover:hover){h2.title a:hover{background-size:100% 3px}}
  .excerpt{cursor:pointer;margin:8px 0 0;font-size:15px;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .why{margin:11px 0 0;font-size:14px;color:var(--text);background:var(--accent-soft);border-left:4px solid var(--accent);padding:8px 10px}
  .why b{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:6px}
  .sum{margin-top:11px;font-size:15px;color:var(--text-2);border-top:2px solid var(--border-2);padding-top:10px}
  .sum ul{margin:8px 0 0;padding-left:18px}
  .sum li{margin-bottom:4px}

  .actions{display:flex;align-items:center;gap:6px;margin-top:13px}
  .act{display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;flex:none;font-family:var(--mono);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text);background:var(--surface);border:2px solid var(--border);padding:0 10px;height:40px;transition:transform .1s ease,box-shadow .1s ease,background .1s ease}
  @media(hover:hover){.act:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 0 var(--border)}}
  .act:active{transform:translate(1px,1px);box-shadow:none}
  .act.primary{background:var(--text);color:var(--bg)}
  .act.on{background:var(--accent);color:var(--accent-ink)}
  .act.icon-only{width:40px;padding:0;font-size:16px}
  .act.right{margin-left:auto;width:40px;padding:0;font-size:16px}

  /* swipe hints */
  .card .rail{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-family:var(--mono);font-size:13px;font-weight:700;text-transform:uppercase;pointer-events:none;opacity:0;transition:opacity .1s;background:var(--surface-2)}
  .card .rail .l{color:var(--text)} .card .rail .r{color:var(--accent)}
  .card .surface{position:relative;background:var(--surface);transition:transform .15s ease}

  /* ---------- Batch footer ---------- */
  .batchend{text-align:center;padding:24px 0 8px;color:var(--text-2)}
  .batchend p{margin:0 0 16px;font-family:var(--mono);font-size:13px;text-transform:uppercase;letter-spacing:.04em;line-height:1.6}
  .btn-wide{display:block;width:100%;max-width:520px;margin:0 auto;background:var(--surface);border:2px solid var(--border);padding:15px;font-family:var(--mono);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text);box-shadow:var(--hard);transition:transform .1s ease,box-shadow .1s ease}
  .btn-wide:active{transform:translate(2px,2px);box-shadow:none}
  .btn-wide.accent{background:var(--accent);color:var(--accent-ink)}

  .empty{text-align:center;background:var(--surface);border:2px solid var(--border);box-shadow:var(--hard);padding:40px 22px}
  .empty h3{margin:10px 0 8px;font-family:var(--display);font-size:34px;line-height:1;text-transform:uppercase}
  .empty p{margin:0 0 18px;color:var(--text-2);font-size:15px}
  .skel{height:300px;background:var(--surface);border:2px solid var(--border);position:relative;overflow:hidden}
  .skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(125,125,125,.14),transparent);animation:sh 1.2s infinite}
  @keyframes sh{to{transform:translateX(100%)}}

  /* ---------- Sources ---------- */
  #sources{max-width:760px;margin:0 auto}
  .searchbox{width:100%;background:var(--surface);border:2px solid var(--border);border-radius:0;padding:12px 14px;font-size:16px;color:var(--text);outline:none;margin-bottom:12px;font-family:var(--mono)}
  .grp{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text);padding:20px 0 8px}
  .srclist{background:var(--surface);border:2px solid var(--border);box-shadow:var(--hard)}
  .srcrow{display:flex;align-items:center;gap:11px;padding:11px 12px;border-bottom:2px solid var(--border-2)}
  .srcrow:last-child{border-bottom:none}
  .srcrow .nm{flex:1;min-width:0}
  .srcrow .nm b{display:block;font-size:15.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .srcrow .nm span{display:block;font-family:var(--mono);font-size:11.5px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- Bottom nav ---------- */
  .bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);border-top:2px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
  .bnav-in{display:flex;align-items:stretch;justify-content:space-around;height:60px;max-width:720px;margin:0 auto}
  .bitem{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--mono);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-3);flex:1}
  .bitem svg{width:22px;height:22px}
  .bitem.on{color:var(--bg);background:var(--text)}

  /* ---------- Modals / toast ---------- */
  .modal{position:fixed;inset:0;z-index:60;background:rgba(10,10,10,.6);display:flex;align-items:flex-end;justify-content:center}
  @media(min-width:640px){.modal{align-items:center;padding:16px}}
  .sheet{background:var(--surface);width:100%;max-width:520px;border:2px solid var(--border);border-bottom:none;padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;animation:rise .25s cubic-bezier(.2,.8,.3,1)}
  @media(min-width:640px){.sheet{border-bottom:2px solid var(--border);box-shadow:8px 8px 0 0 var(--accent);padding-bottom:20px}}
  .sheet h3{margin:0 0 14px;font-family:var(--display);font-size:26px;line-height:1;text-transform:uppercase;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .field{width:100%;background:var(--bg);border:2px solid var(--border);border-radius:0;padding:12px 13px;font-size:16px;color:var(--text);outline:none;font-family:inherit}
  .field:focus{box-shadow:var(--hard)}
  .lbl{display:block;font-family:var(--mono);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text);margin:18px 0 7px}
  .btn{width:100%;background:var(--accent);color:var(--accent-ink);border:2px solid var(--border);font-family:var(--mono);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.05em;padding:13px;margin-top:12px;box-shadow:var(--hard);transition:transform .1s ease,box-shadow .1s ease}
  .btn:active{transform:translate(2px,2px);box-shadow:none}
  .btn.sec{background:var(--surface);color:var(--text)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-family:var(--mono);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:var(--surface);border:2px solid var(--border);padding:3px 8px;color:var(--text)}
  .rateopts{display:flex;gap:8px}
  .rateopt{flex:1;background:var(--surface);border:2px solid var(--border);padding:12px 6px;text-align:center;font-family:var(--mono);font-size:11.5px;font-weight:700;text-transform:uppercase;color:var(--text)}
  .rateopt .em{display:block;font-size:22px;margin-bottom:4px}
  .rateopt.on{background:var(--text);color:var(--bg);box-shadow:3px 3px 0 0 var(--accent)}
  #toast{visibility:hidden;opacity:0;pointer-events:none;position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:70;background:var(--text);color:var(--bg);border:2px solid var(--border);box-shadow:4px 4px 0 0 var(--accent);padding:12px 14px;font-family:var(--mono);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:520px;margin:0 auto;transform:translateY(140%);transition:transform .22s cubic-bezier(.2,.8,.3,1),opacity .18s ease,visibility .18s}
  #toast.up{visibility:visible;opacity:1;pointer-events:auto;transform:translateY(0)}
  #toast button{font-weight:800;color:var(--accent);text-transform:uppercase;white-space:nowrap}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
    .ticker .run{transform:none}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-in">
    <div class="brand"><span class="logo" aria-hidden="true">FF</span><div class="topbar-title"><span id="view-title">Hoy</span><span id="unread-pill" class="pill-count hidden">0</span><span id="dev-user-pill" class="pill-count hidden"></span></div></div>
    <div class="topbar-actions">
      <button class="ico" data-act="markall" title="Marcar todo como leído">
        <svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
      </button>
      <button class="ico" data-act="sync" id="sync-ico" title="Sincronizar">

<script>
const PAGE = 16;
let currentTab='curated', items=[], feeds=[], rendered=[], fbItemId=null, fbRating='love';
let syncing=false, enrichRounds=0, undoTimer=null, srcQuery='';

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function relTime(iso){
  if(!iso) return '';
  // Las fechas sin zona horaria vienen en UTC desde el backend. Sin la Z,
  // el navegador las lee como hora local y los items salen en el futuro.
  let raw=String(iso);
  if(!/[Zz]|[+-]\d{2}:?\d{2}$/.test(raw) && raw.includes('T')) raw += 'Z';
  const d=new Date(raw); if(isNaN(d.getTime())) return '';
  const s=(Date.now()-d.getTime())/1000;
  if(s<0) return 'ahora';
  if(s<60) return 'ahora';
  if(s<3600) return Math.floor(s/60)+'m';
  if(s<86400) return Math.floor(s/3600)+'h';
  if(s<604800) return Math.floor(s/86400)+'d';
  if(s<2419200) return Math.floor(s/604800)+' sem';
  // Con más de 11 meses el día ya no dice nada: se muestra mes y año.
  if(s>=28512000) return d.toLocaleDateString('es-MX',{month:'short',year:'numeric'});
  return d.toLocaleDateString('es-MX',{day:'numeric',month:'short'});
}
function clean(t){
  if(!t) return '';
  return String(t)
    .replace(/!\[[^\]]*\]\([^)]*\)/g,'').replace(/\[([^\]]*)\]\([^)]*\)/g,'$1')
    .replace(/^#{1,6}\s*/gm,'').replace(/\*\*(.*?)\*\*/g,'$1')
    .replace(/(?<!\*)\*([^*]+)\*(?!\*)/g,'$1').replace(/__(.*?)__/g,'$1')
    .replace(/(?<!\w)_([^_]+)_(?!\w)/g,'$1').replace(/`([^`]*)`/g,'$1')
    .replace(/<[^>]+>/g,' ').replace(/\s{2,}/g,' ').trim();
}
const GENERIC=new Set(['Autor','Canal de YouTube']);
// Color estable por fuente para las tarjetas sin imagen.
function sourceHue(it){
  const f=feeds.find(f=>f.id===it.feed_id);
  const key=(f&&f.title)||sourceName(it);
  let h=0; for(const c of key) h=(h*31+c.codePointAt(0))>>>0;
  return h%360;
}
function placeholderHTML(hue,name){
  return `<div class="ph" style="--h:${hue}" aria-hidden="true"><b>${esc(name)}</b></div>`;
}
// Publicación (el feed al que estás suscrito) y autor, por separado.
function pubName(it){
  const f=feeds.find(f=>f.id===it.feed_id);
  const t=(f&&f.title||'').trim();
  // Fuentes dadas de alta con la URL como título: se muestra el dominio.
  if(/^https?:\/\//.test(t)){ try{ return new URL(t).hostname.replace(/^www\./,''); }catch(e){} }
  return t||sourceName(it);
}
function byline(it){
  let a=(it.author||'').trim();
  // RSS de podcasts: "correo@dominio (Nombre)" se queda en el nombre.
  const m=a.match(/@\S*\s*\(([^)]+)\)\s*$/); if(m) a=m[1].trim();
  if(/^\S+@\S+$/.test(a)) a='';
  if(!a || GENERIC.has(a)) return '';
  const p=pubName(it).toLowerCase(), al=a.toLowerCase();
  // En YouTube y en blogs personales canal y autor son la misma persona.
  return (p.includes(al)||al.includes(p))? '' : a;
}
function sourceName(it){
  const f=feeds.find(f=>f.id===it.feed_id);
  if(it.author && !GENERIC.has(it.author)) return it.author;
  return f? f.title : (it.author||'Fuente');
}
function toast(msg,actionLabel,actionFn){
  const t=$('#toast'), b=$('#toast-action');
  $('#toast-msg').textContent=msg;
  clearTimeout(undoTimer);
  if(actionLabel){ b.textContent=actionLabel; b.classList.remove('hidden'); b.onclick=()=>{t.classList.remove('up');actionFn&&actionFn();}; }
  else b.classList.add('hidden');
  t.classList.add('up');
  undoTimer=setTimeout(()=>t.classList.remove('up'), actionLabel?5200:2600);
}
function openModal(id){$('#'+id).classList.remove('hidden')}
function closeModal(id){$('#'+id).classList.add('hidden')}

/* ---------------- data ---------------- */
// Cambio de cuenta solo para desarrollo: ?user=<uuid> permite abrir dos
// sesiones distintas y comprobar el aislamiento. El servidor ignora esta
// cabecera cuando Supabase está configurado, así que en producción es inerte.
function applyTheme(choice){
  const root=document.documentElement;
  if(choice==='auto') root.removeAttribute('data-theme');
  else root.setAttribute('data-theme',choice);
  try{ localStorage.setItem('ff_theme',choice); }catch(e){}
  document.querySelectorAll('[data-theme-opt]').forEach(b=>
    b.classList.toggle('on', b.dataset.themeOpt===choice));
}

function currentTheme(){
  try{ return localStorage.getItem('ff_theme') || 'auto'; }catch(e){ return 'auto'; }
}

const DEV_USER = (()=>{
  const q=new URLSearchParams(location.search).get('user');
  if(q){ sessionStorage.setItem('ff_dev_user', q); return q; }
  return sessionStorage.getItem('ff_dev_user') || '';
})();

async function api(path,opts){
  const o = Object.assign({}, opts||{});
  o.headers = Object.assign({}, o.headers||{});
  if(DEV_USER) o.headers['X-Dev-User']=DEV_USER;
  const r=await fetch(path,o);
  const data = await r.json().catch(()=>({}));
  // Sin esto la interfaz daba por buena una escritura que nunca ocurrió.
  if(!r.ok || data.status==='error') throw new Error(data.message || `HTTP ${r.status}`);
  return data;
}

async function loadFeeds(){
  try{ feeds=await api('/api/feeds')||[]; $('#c-sources').textContent=feeds.length; }catch(e){}
}
// Dos maneras de traer el feed:
//  loadItems()    lo pidió el usuario (pestaña, filtro, deshacer): repinta y anima.
//  refreshQuiet() segundo plano (sync, resúmenes de IA, después de una acción):
//                 actualiza contadores y tarjetas en su lugar, nunca repinta la
//                 lista. Lo nuevo espera detrás de la píldora "↑ N nuevos".
let pendingItems=null;
function paintCounts(c){
  c=c||{};
  $('#c-reading').textContent=c.reading||0;
  const unread=(c.inbox||0);
  $('#unread-pill').textContent=unread;
  $('#unread-pill').classList.toggle('hidden', currentTab==='sources'||currentTab==='reading'||!unread);
}
async function loadItems(){
  const feed=$('#feed');
  pendingItems=null; $('#new-pill').classList.add('hidden');
  feed.innerHTML='<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  try{
    const data=await api(`/api/items?tab=${currentTab}&type=${$('#filter-type').value}&limit=200`);
    items=data.items||[];
    paintCounts(data.counts);
    render(true);
    if(enrichRounds<3 && items.some(i=>!i.summary_tldr)) enrich();
  }catch(e){
    feed.innerHTML=`<div class="empty"><h3>No se pudo cargar</h3><p>${esc(e.message)}</p></div>`;
  }
}
// Ancla manual de scroll: Safari en iPhone no tiene overflow-anchor. Se toma la
// primera tarjeta visible, se aplica el cambio y se compensa lo que se movió.
function keepAnchor(mutate){
  const cards=[...document.querySelectorAll('#feed .card')];
  const a=cards.find(c=>c.getBoundingClientRect().bottom>0);
  const before=a? a.getBoundingClientRect().top : 0;
  mutate();
  if(a && a.isConnected){ const d=a.getBoundingClientRect().top-before; if(d) window.scrollBy(0,d); }
}
function patchCard(n){
  const card=document.querySelector(`#feed .card[data-id="${n.id}"]`);
  if(!card) return;
  const tmp=document.createElement('div');
  tmp.innerHTML=cardHTML(n,0);
  const fresh=tmp.querySelector('.card-body'), old=card.querySelector('.card-body');
  // Solo texto: la imagen y el estado de "Resumen abierto" se quedan como están.
  const wasOpen=old && !old.querySelector('.sum').classList.contains('hidden');
  if(!fresh || !old || fresh.innerHTML===old.innerHTML) return;
  old.innerHTML=fresh.innerHTML;
  if(wasOpen) old.querySelector('.sum').classList.remove('hidden');
  const sc=card.querySelector('.media .score'), nsc=tmp.querySelector('.media .score');
  if(sc && nsc) sc.replaceWith(nsc); else if(!sc && nsc) card.querySelector('.media').appendChild(nsc);
}
async function refreshQuiet(){
  if(currentTab==='sources') return;
  try{
    const data=await api(`/api/items?tab=${currentTab}&type=${$('#filter-type').value}&limit=200`);
    const fresh=data.items||[];
    paintCounts(data.counts);
    const byId=new Map(items.map(i=>[i.id,i]));
    const visible=new Set(rendered);
    keepAnchor(()=>{
      for(const n of fresh){
        const o=byId.get(n.id);
        if(o) Object.assign(o,n);
        if(visible.has(n.id)) patchCard(o||n);
      }
    });
    // Solo cuenta lo que entraría al lote visible: el item 201 que sube de la
    // cola al archivar uno no es "nuevo".
    const nuevos=fresh.slice(0,PAGE).filter(n=>!byId.has(n.id)).length;
    if(nuevos){
      pendingItems=fresh;
      $('#new-count').textContent=nuevos===1?'1 nuevo':`${nuevos} nuevos`;
      $('#new-pill').classList.remove('hidden');
    }
  }catch(e){}
}
function showNew(){
  if(pendingItems) items=pendingItems;
  pendingItems=null; $('#new-pill').classList.add('hidden');
  window.scrollTo(0,0);
  render(true);
}

async function enrich(){
  enrichRounds++;
  try{
    const d=await api('/api/items/process-pending',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({limit:10})});
    if(d.processed>0) refreshQuiet();
  }catch(e){}
}
async function loadProfile(){
  try{
    const p=await api('/api/profile'), st=await api('/api/status');
    $('#db-status').textContent = st.is_supabase? '● Supabase conectado' : '● Modo local (SQLite)';
    const L=p.learned_preferences||{};
    const a=L.boosted_authors||[];
    $('#l-authors').innerHTML = a.length? a.map(x=>`<span class="chip">✓ ${esc(x)}</span>`).join('') : '<span class="chip">Aún sin canales calificados</span>';
    const tg=Object.keys(L.boosted_tags||{});
    $('#l-tags').innerHTML = tg.length? tg.map(x=>`<span class="chip">★ ${esc(x)}</span>`).join('') : '<span class="chip">Califica con ❤️ lo que te guste</span>';
    $('#l-topics').value=(p.focus_topics||[]).join('\n');
  }catch(e){}
}

/* ---------------- render ---------------- */
const TITLES={curated:'Hoy',reading:'Guardados',inbox:'Todo',sources:'Fuentes'};
function setTab(tab){
  currentTab=tab; enrichRounds=0;
  $('#view-title').textContent=TITLES[tab]||'Hoy';
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  document.querySelectorAll('.bitem').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const isSrc=tab==='sources';
  $('#feed').classList.toggle('hidden',isSrc);
  $('#sources').classList.toggle('hidden',!isSrc);
  window.scrollTo(0,0);
  if(isSrc){ $('#unread-pill').classList.add('hidden'); renderSources(); } else loadItems();
}

const TYPE_LABEL={video:'Video',podcast:'Podcast',article:'Lectura'};
function cardHTML(it,idx){
  const score=it.relevance_score||0;
  const type=TYPE_LABEL[it.content_type]?it.content_type:'article';
  let tk=[]; try{ tk=it.key_takeaways? (typeof it.key_takeaways==='string'? JSON.parse(it.key_takeaways):it.key_takeaways):[] }catch(e){}
  const saved=it.status==='reading';
  const img=it.thumbnail_url==='none'?'':it.thumbnail_url;
  const thumb=img||(it.video_id?`https://i.ytimg.com/vi/${it.video_id}/hqdefault.jpg`:'');
  const excerpt=clean(it.summary_tldr||it.raw_content||'');
  const src=pubName(it), by=byline(it), hue=sourceHue(it);
  const when=relTime(it.published_at);

  const media = `
    <a class="media" href="${esc(it.url)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">
      ${thumb
        ? `<img src="${esc(thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer" data-ph="${hue}" data-name="${esc(src)}">`
        : placeholderHTML(hue,src)}
      <span class="badge ${type!=='article'?'play':''}">${type==='video'?'▶ ':type==='podcast'?'◉ ':''}${TYPE_LABEL[type]}</span>
      ${score?`<span class="score ${score>=85?'hi':''}">${score}</span>`:''}
    </a>`;

  return `
  <article class="card" data-id="${it.id}" style="--i:${Math.min(idx||0,8)}">
    <div class="rail"><span class="l">Guardar</span><span class="r">Visto ✓</span></div>
    <div class="surface">
      ${media}
      <div class="card-body">
        <div class="meta"><span class="src">${esc(src)}</span>${by?`<span class="by">· ${esc(by)}</span>`:''}${when?`<span class="when">${esc(when)}</span>`:''}</div>
        <h2 class="title"><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a></h2>
        ${excerpt?`<p class="excerpt" data-act="sum" data-id="${it.id}">${esc(excerpt)}</p>`:''}
        ${it.curator_note?`<p class="why"><b>Por qué</b>${esc(clean(it.curator_note))}</p>`:''}
        <div class="sum hidden" id="sum-${it.id}">
          ${excerpt?`<p style="margin:0">${esc(excerpt)}</p>`:''}
          ${tk.length?`<ul>${tk.map(t=>`<li>${esc(clean(t))}</li>`).join('')}</ul>`:''}
        </div>
        <div class="actions">
          <button class="act primary" data-act="read" data-id="${it.id}">✓ Visto</button>
          <button class="act ${saved?'on':''}" data-act="save" data-id="${it.id}">${saved?'Guardado':'Guardar'}</button>
          <button class="act icon-only" data-act="love" data-id="${it.id}" aria-label="Me encanta">${it.user_rating==='love'?'♥':'♡'}</button>
          <button class="act icon-only" data-act="dislike" data-id="${it.id}" aria-label="No me interesa" style="${it.user_rating==='dislike'?'':'opacity:.55'}">👎</button>
          ${(excerpt||tk.length)?`<button class="act right" data-act="sum" data-id="${it.id}" aria-label="Resumen">▾</button>`:''}
        </div>
      </div>
    </div>
  </article>`;
}

// Imagen rota (hotlink bloqueado, 404): se cambia por el respaldo de color.
document.addEventListener('error',e=>{
  const img=e.target;
  if(!(img instanceof HTMLImageElement) || img.dataset.ph==null) return;
  img.insertAdjacentHTML('afterend',placeholderHTML(img.dataset.ph,img.dataset.name||''));
  img.remove();
},true);

// Imagen bajo demanda: solo las tarjetas que se van a ver y no la tienen.
// El servidor la busca una vez y la guarda; el bloque de color se cambia por la foto.
// render() corre varias veces por carga: cada id se pide una sola vez por sesión.
const askedImages=new Set();
async function fillImages(batch){
  const ids=batch.filter(i=>i.content_type!=='video' && !i.thumbnail_url && !askedImages.has(i.id)).map(i=>i.id);
  if(!ids.length) return;
  ids.forEach(id=>askedImages.add(id));
  let res;
  try{ res=await api('/api/items/fill-images',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})}); }
  catch(e){ return; }
  for(const it of batch){
    if(!ids.includes(it.id)) continue;
    const url=(res.images||{})[it.id];
    it.thumbnail_url=url||'none';
    const ph=url && document.querySelector(`.card[data-id="${it.id}"] .media .ph`);
    const live=items.find(x=>x.id===it.id); if(live) live.thumbnail_url=it.thumbnail_url;
    if(!ph) continue;
    const im=new Image(); im.alt=''; im.referrerPolicy='no-referrer';
    im.dataset.ph=sourceHue(it); im.dataset.name=pubName(it);
    im.onload=()=>ph.replaceWith(im);
    im.src=url;
  }
}

// Ticker: los titulares del lote corren arriba, como el "now playing" de la radio.
function renderTicker(batch){
  const t=$('#ticker'), run=$('#ticker-run');
  const head=(i,dup)=>`<span class="hl" data-act="goto" data-id="${i.id}" role="link" ${dup?'aria-hidden="true" tabindex="-1"':'tabindex="0"'}><b>${esc(pubName(i))}</b>${esc(i.title)}</span>`;
  const top=batch.slice(0,8);
  const heads=top.map(i=>head(i,false)).join('')+top.map(i=>head(i,true)).join('');
  // El ticker nunca se oculta: si cambiara de alto, todo el feed brincaría.
  run.innerHTML=heads?heads: '<span>Sin titulares nuevos</span>';
  run.style.setProperty('--dur',Math.max(40,batch.slice(0,8).length*11)+'s');
}
new ResizeObserver(()=>document.documentElement.style.setProperty('--hdr',$('.topbar').offsetHeight+'px')).observe($('.topbar'));

function gotoCard(id){
  const el=document.querySelector(`#feed .card[data-id="${id}"]`);
  if(!el){ toast('Ese artículo ya no está en la lista'); return; }
  el.scrollIntoView({behavior:'smooth',block:'start'});
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  setTimeout(()=>el.classList.remove('flash'),1500);
}
document.addEventListener('keydown',e=>{
  const h=e.target.closest&&e.target.closest('.hl[data-act="goto"]');
  if(h&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); gotoCard(+h.dataset.id); }
});

function render(animate){
  const feed=$('#feed');
  feed.classList.toggle('anim',!!animate);
  if(animate) setTimeout(()=>feed.classList.remove('anim'),1200);
  if(!items.length){
    renderTicker([]);
    feed.innerHTML=`<div class="empty"><h3>${currentTab==='reading'?'Nada guardado todavía':'Todo al día'}</h3>
      <p>${currentTab==='reading'?'Usa Guardar en cualquier tarjeta o desliza a la derecha.':'Tienes '+feeds.length+' fuentes conectadas. Sincroniza para traer lo más reciente.'}</p>
      ${currentTab==='reading'?'':'<button class="btn-wide accent" data-act="sync">⚡ Sincronizar ahora</button>'}</div>`;
    rendered=[];
    return;
  }
  const batch=items.slice(0,PAGE);
  rendered=batch.map(i=>i.id);
  const sources=new Set(batch.map(i=>sourceName(i))).size;
  const more=items.length-batch.length;
  renderTicker(batch);
  fillImages(batch);
  feed.innerHTML = batch.map((it,i)=>cardHTML(it,i)).join('') + `
    <div class="batchend">
      <p>Revisaste ${batch.length} ${batch.length===1?'artículo':'artículos'} de ${sources} ${sources===1?'fuente':'fuentes'}${more?`.<br>Quedan ${more} en cola.`:'.'}</p>
      <button class="btn-wide" data-act="markall">Marcar todo como leído</button>
    </div>`;
  attachSwipe();
}

function renderSources(){
  const el=$('#sources');
  if(!feeds.length){
    el.innerHTML=`<div class="empty"><div style="font-size:34px">📡</div><h3>Sin canales</h3><p>Pega tu OPML de Feedly o la URL de un canal.</p><button class="btn-wide accent" data-act="open-add">+ Agregar fuentes</button></div>`;
    return;
  }
  const q=srcQuery.toLowerCase();
  const list=feeds.filter(f=>!q||(f.title||'').toLowerCase().includes(q)||(f.custom_category||'').toLowerCase().includes(q));
  const cats={};
  list.forEach(f=>{ const c=f.custom_category||'General'; (cats[c]=cats[c]||[]).push(f); });
  let html=`<input class="searchbox" id="src-search" placeholder="Buscar entre tus ${feeds.length} fuentes…" value="${esc(srcQuery)}">
    <button class="btn-wide accent" data-act="sync">⚡ Sincronizar todas</button>`;
  for(const [c,fl] of Object.entries(cats)){
    html+=`<div class="grp">${esc(c)} · ${fl.length}</div><div class="srclist">`+fl.map(f=>{
      const ic=f.feed_type==='youtube'?'🎬':(f.feed_type==='substack'?'💌':'📄');
      return `<div class="srcrow"><span style="font-size:19px">${ic}</span>
        <div class="nm"><b>${esc(f.title)}</b><span>${esc(f.feed_url)}</span></div>
        <button class="act icon-only" data-act="sync-one" data-id="${f.id}">↻</button>
        <button class="act icon-only" data-act="del-feed" data-id="${f.id}">✕</button></div>`;
    }).join('')+`</div>`;
  }
  el.innerHTML=html;
  const s=$('#src-search');
  if(s){ s.oninput=e=>{ srcQuery=e.target.value; const pos=e.target.selectionStart; renderSources(); const n=$('#src-search'); n.focus(); n.setSelectionRange(pos,pos); }; }
}

/* ---------------- acciones ---------------- */
function removeCard(id){
  const el=document.querySelector(`.card[data-id="${id}"]`);
  if(el){ el.classList.add('gone'); setTimeout(()=>el.remove(),190); }
  items=items.filter(i=>i.id!==id);
  rendered=rendered.filter(x=>x!==id);
}
async function setStatus(id,status){
  return api(`/api/items/${id}/status`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});
}
async function markRead(id){
  // Guardar el estado previo: si estaba guardado, deshacer debe devolverlo
  // a guardado, no dejarlo en inbox y perder el marcador.
  const previo=(items.find(i=>i.id===id)||{}).status||'inbox';
  try{
    await setStatus(id,'archived');
  }catch(e){
    toast('No se pudo marcar como visto: '+e.message);
    return;
  }
  removeCard(id);
  toast('Marcado como visto','Deshacer',async()=>{
    try{ await setStatus(id,previo); refreshQuiet(); }
    catch(e){ toast('No se pudo deshacer: '+e.message); }
  });
  if(rendered.length===0) loadItems();
}
async function toggleSave(id){
  const it=items.find(i=>i.id===id); if(!it) return;
  const next=it.status==='reading'?'inbox':'reading';
  try{
    await setStatus(id,next);
  }catch(e){
    toast('No se pudo guardar: '+e.message);
    return;
  }
  it.status=next;
  markSaveButton(id,next==='reading');
  toast(next==='reading'?'Guardado en tu lista':'Quitado de guardados');
  refreshQuiet();
  if(currentTab==='reading' && next!=='reading') removeCard(id);
}

function markSaveButton(id,saved){
  const btn=document.querySelector(`.act[data-act="save"][data-id="${id}"]`);
  if(!btn) return;
  btn.textContent = saved ? 'Guardado' : 'Guardar';
  btn.classList.toggle('on',saved);
}
async function rate(id,rating){
  const it=items.find(i=>i.id===id);
  try{
    const res=await api(`/api/items/${id}/feedback`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rating})});
    if(it){ it.user_rating=rating; if(res.new_status) it.status=res.new_status; }

    if(res.new_status==='archived'){
      removeCard(id);
      toast('Menos contenido así 👎');
      if(rendered.length===0) loadItems();
    }else if(res.new_status==='reading'){
      // El corazón guarda automático: la tarjeta se queda, marcada.
      markSaveButton(id,true);
      const b=document.querySelector(`.act[data-act="love"][data-id="${id}"]`);
      if(b) b.textContent='♥';
      toast('Guardado en tu lista ❤️');
      refreshQuiet();
    }else{
      toast('Anotado');
    }
    loadProfile();
  }catch(e){ toast('Error al calificar: '+e.message); }
}
async function markAllRead(){
  // lo guardado con el marcador no se marca como leido: es una lista aparte
  const ids=rendered.filter(id=>{ const it=items.find(i=>i.id===id); return !it||it.status!=='reading'; });
  if(!ids.length){ toast('No hay nada que marcar'); return; }
  try{
    await api('/api/items/bulk-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids,status:'archived'})});
  }catch(e){
    toast('No se pudo marcar como leído: '+e.message);
    return;
  }
  ids.forEach(removeCard);
  toast(`${ids.length} marcados como leídos`,'Deshacer',async()=>{
    try{
      await api('/api/items/bulk-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids,status:'inbox'})});
      loadItems();
    }catch(e){ toast('No se pudo deshacer: '+e.message); }
  });
  loadItems();
}
function openFeedback(id){
  const it=items.find(i=>i.id===id); if(!it) return;
  fbItemId=id; $('#fb-title').textContent=it.title;
  setRate(it.user_rating&&it.user_rating!=='none'?it.user_rating:'love');
  $('#fb-comment').value=it.user_feedback_comment||'';
  openModal('modal-feedback');
}
function setRate(r){
  fbRating=r;
  // Acotado al modal de feedback: el selector de apariencia reusa .rateopt
  // y sin este alcance perdería su resaltado al abrir la calificación.
  document.querySelectorAll('#modal-feedback .rateopt').forEach(b=>b.classList.toggle('on',b.dataset.rate===r));
}
async function submitFeedback(){
  if(!fbItemId) return;
  try{
    await api(`/api/items/${fbItemId}/feedback`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rating:fbRating,comment:$('#fb-comment').value.trim()})});
  }catch(e){ toast('No se pudo guardar la calificación: '+e.message); return; }
  closeModal('modal-feedback'); toast('Curador calibrado'); refreshQuiet(); loadProfile();
}
const SYNC_BATCH=40, SYNC_PARALLEL=3, AUTO_SYNC_MIN=30;
async function syncAll(){
  if(syncing) return; syncing=true;
  const live=$('#ticker-live');
  $('#sync-ico').style.opacity=.4;
  const total=feeds.length||1;
  const offsets=[]; for(let o=0;o<total;o+=SYNC_BATCH) offsets.push(o);
  let done=0, added=0, failed=0;
  const paint=()=>{
    live.textContent=`Sincronizando ${Math.min(done,total)}/${total}${added?` · ${added} nuevos`:''}`;
  };
  paint();
  async function worker(){
    while(offsets.length){
      const offset=offsets.shift();
      try{
        const d=await api('/api/feeds/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({offset,limit:SYNC_BATCH})});
        added+=d.new_items||0;
      }catch(e){ failed++; }
      done+=SYNC_BATCH; paint();
    }
  }
  try{
    await Promise.all(Array.from({length:SYNC_PARALLEL},worker));
    try{ localStorage.setItem('ff-last-sync',String(Date.now())); }catch(e){}
    toast(failed?`Sincronizado con ${failed} tandas fallidas · ${added} nuevos`:`Sincronizado · ${added} nuevos`);
    await loadFeeds(); await refreshQuiet();
  }finally{ syncing=false; live.textContent='En el aire'; $('#sync-ico').style.opacity=1; }
}
function autoSyncIfStale(){
  let last=0; try{ last=+localStorage.getItem('ff-last-sync')||0; }catch(e){}
  if(feeds.length && Date.now()-last>AUTO_SYNC_MIN*60000) syncAll();
}

/* ---------------- swipe ---------------- */
function attachSwipe(){
  document.querySelectorAll('.card').forEach(card=>{
    const surf=card.querySelector('.surface'), rail=card.querySelector('.rail');
    let x0=0,y0=0,dx=0,active=false,decided=false;
    card.addEventListener('touchstart',e=>{ const t=e.touches[0]; x0=t.clientX; y0=t.clientY; dx=0; active=true; decided=false; surf.style.transition='none'; },{passive:true});
    card.addEventListener('touchmove',e=>{
      if(!active) return;
      const t=e.touches[0], ddx=t.clientX-x0, ddy=t.clientY-y0;
      if(!decided){ if(Math.abs(ddy)>Math.abs(ddx)){ active=false; return; } decided=Math.abs(ddx)>10; }
      if(!decided) return;
      dx=ddx; surf.style.transform=`translateX(${dx}px)`;
      rail.style.opacity=Math.min(Math.abs(dx)/90,1);
    },{passive:true});
    card.addEventListener('touchend',()=>{
      if(!active){ return; }
      active=false; surf.style.transition=''; surf.style.transform=''; rail.style.opacity=0;
      const id=+card.dataset.id;
      if(dx<-90) markRead(id);
      else if(dx>90) toggleSave(id);
    });
  });
}

/* ---------------- delegación de eventos ---------------- */
document.addEventListener('click',async e=>{
  const tabBtn=e.target.closest('[data-tab]');
  if(tabBtn){ setTab(tabBtn.dataset.tab); return; }
  const el=e.target.closest('[data-act]'); if(!el) return;
  const id=+el.dataset.id, act=el.dataset.act;
  try{
  if(act==='read') markRead(id);
  else if(act==='save') toggleSave(id);
  else if(act==='love') rate(id,'love');
  else if(act==='dislike') rate(id,'dislike');
  else if(act==='sum'){ const s=$('#sum-'+id); s.classList.toggle('hidden'); const b=document.querySelector(`.act.right[data-id="${id}"]`); if(b) b.textContent=s.classList.contains('hidden')?'▾':'▴'; }
  else if(act==='goto') gotoCard(id);
  else if(act==='markall') markAllRead();
  else if(act==='show-new') showNew();
  else if(act==='sync') syncAll();
  else if(act==='open-add') openModal('modal-add');
  else if(act==='open-learned'){ loadProfile(); openModal('modal-learned'); }
  else if(act==='close') closeModal(el.dataset.modal);
  else if(act==='submit-feedback') submitFeedback();
  else if(act==='save-topics'){
    const topics=$('#l-topics').value.split('\n').map(t=>t.trim()).filter(Boolean);
    await api('/api/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({focus_topics:topics})});
    closeModal('modal-learned'); toast('Temas actualizados'); loadItems();
  }
  else if(act==='add-feed'){
    const url=$('#feed-url').value.trim(); if(!url) return;
    toast('Conectando canal…');
    const d=await api('/api/feeds',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
    if(d.status==='success'){ $('#feed-url').value=''; closeModal('modal-add'); toast(`Canal agregado (+${d.new_items||0})`); await loadFeeds(); loadItems(); }
    else toast('Error: '+(d.message||'no se pudo agregar'));
  }
  else if(act==='import-opml'){
    const text=$('#opml').value.trim(); if(!text) return;
    toast('Importando…');
    const d=await api('/api/feeds/import-opml',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({opml:text})});
    if(d.status==='success'){ $('#opml').value=''; closeModal('modal-add'); toast(`${d.imported_count} fuentes importadas`); await loadFeeds(); syncAll(); }
    else toast('Error al importar');
  }
  else if(act==='sync-one'){
    const f=feeds.find(x=>x.id===id); if(!f) return;
    toast('Sincronizando '+f.title+'…');
    const d=await api('/api/feeds/sync-single',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({feed_id:f.id,feed_url:f.feed_url,feed_type:f.feed_type})});
    toast(`+${d.new_items||0} nuevos`);
  }
  else if(act==='del-feed'){
    const f=feeds.find(x=>x.id===id); if(!f) return;
    if(!confirm(`¿Eliminar ${f.title}?`)) return;
    await api('/api/feeds/'+id,{method:'DELETE'});
    await loadFeeds(); renderSources(); toast('Fuente eliminada');
  }
  }catch(err){ toast('Algo falló: '+err.message); }
});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-theme-opt]');
  if(t){ applyTheme(t.dataset.themeOpt); return; }
  const r=e.target.closest('.rateopt'); if(r) setRate(r.dataset.rate);
});
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m) m.classList.add('hidden'); }));
$('#filter-type').addEventListener('change',()=>loadItems());

if(DEV_USER){
  const pill=$('#dev-user-pill');
  pill.textContent='dev · '+DEV_USER.slice(0,8);
  pill.classList.remove('hidden');
}

applyTheme(currentTheme());

(async function init(){ await loadFeeds(); await loadItems(); loadProfile(); autoSyncIfStale(); })();
</script>
